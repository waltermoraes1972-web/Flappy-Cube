name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: |
          unzip -o FlappyCube_projeto.zip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK Debug
        run: |
          DIR=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
          echo "Pasta do projeto: $DIR"
          cd "$DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-cube-debug
          path: "**/build/outputs/apk/debug/*.apk"
