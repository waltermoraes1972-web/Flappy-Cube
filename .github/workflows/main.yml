name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: |
          ls -la
          unzip -o FlappyCube_projeto.zip
          echo "=== DEPOIS DO UNZIP ==="
          ls -la
          find . -maxdepth 4 -type f | head -n 100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK Debug
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          echo "Gradlew encontrado em: $GRADLEW"
          if [ -z "$GRADLEW" ]; then
            echo "NAO ACHOU gradlew"
            find . -type f -name "*.gradle" | head -n 20
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "Pasta do projeto: $DIR"
          cd "$DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flappy-cube-debug
          path: "**/build/outputs/apk/debug/*.apk"
